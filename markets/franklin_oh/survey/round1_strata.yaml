# Field rate survey — round 1 (Bernard, M3 decisions 2026-09-26; revised at M3 review).
# Posted rates for all dayparts. Areas are Submarkets names (markets/franklin_oh/submarkets.geojson).
# Public right-of-way observation only; operator websites read manually count as a source.
round: 1
min_spacing_m: 150          # spread picks within an area (navigation aid, not a model parameter)
backups_per_area: 5
exclude:                    # not public paid parking — never sampled
  - {field: operator, pattern: "Columbus State", reason: "student permit lot"}
  - {field: name, pattern: "\bpermit\b", reason: "permit-only lot"}
  - {field: operator, pattern: "Kroger", reason: "grocery customer lot (Bernard, M4 review)"}
  - {field: operator, pattern: "Nationwide Children's Homecare", reason: "likely staff lot (Bernard, M4 review)"}
strata:
  - {label: "Downtown Zone A/B", areas: ["Downtown (Zone A/B)"], n: 12, garages: 4}
  - {label: "Arena District", areas: ["Arena District"], n: 3, garages: 0}
  - {label: "Short North", areas: ["Short North"], n: 2, garages: 0}
  - label: "University District"
    areas: ["University District"]
    n: 5
    garages: 0
    manual:                 # OSU campus garages outside the SID strip (CampusParc publishes rates)
      - {name: "Ohio Union South Parking Garage", operator: CampusParc, source: "operator website",
         why: "OSU visitor garage, CampusParc — rates from operator website"}
      - {name: "Lane Avenue Parking Garage", operator: CampusParc, source: "operator website",
         why: "OSU visitor garage near the stadium, CampusParc — rates from operator website"}
  - {label: "Brewery District / German Village", areas: ["Brewery District / German Village"], n: 4, garages: 0}
  - {label: "Franklinton", areas: ["Franklinton"], n: 4, garages: 0}
  - label: "Paid-signal check (V-45)"
    areas: []               # outside the survey areas: only these manual picks
    n: 5
    garages: 0
    manual:                 # OSM fee=yes is the only paid signal behind hot zones at Easton and Mount Carmel East
      - {osm_id: "relation/10567279", operator: "", source: "sign / app rate screen",
         why: "V-45: fee=yes garage near Mount Carmel East — paid to visitors or free?"}
      - {osm_id: "relation/8277325", operator: "", source: "sign / app rate screen",
         why: "V-45: Easton fee=yes lot (261 stalls est.) — paid or free?"}
      - {osm_id: "way/608043845", operator: "Hilton Columbus at Easton", source: "sign / hotel website",
         why: "V-45: Easton hotel lot tagged fee=yes — public paid, guest-only or free?"}
      - {osm_id: "way/587344190", operator: "", source: "sign / app rate screen",
         why: "V-45: Easton fee=yes lot — paid or free?"}
      - {osm_id: "way/587344291", operator: "", source: "sign / app rate screen",
         why: "V-45: Easton fee=yes lot — paid or free?"}
