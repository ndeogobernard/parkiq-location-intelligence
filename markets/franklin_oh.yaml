# Franklin County, OH — pilot market (ADR-0001, admin workbook).
# Values and statuses mirror docs/reference/ParkIQ_FranklinOH_Admin.xlsx → Parameters.
# null = DECIDE (blank in the workbook): check-config shows which steps each one blocks.
# `parkiq check-config --market markets/franklin_oh.yaml --report franklin_params.csv`
# writes these back out in the workbook's Parameters layout.
market:
  name: "Franklin County, OH"
  slug: franklin_oh
  boundary: {type: county, value: "39049"}
  focus_submarkets: []          # DECIDE after the county-wide demand scan (ADR-0008)
  submarkets_source:           # survey strata for reporting only (never a filter); built from City layers + S23c
    path: franklin_oh/submarkets.geojson
    name_field: name
    type_field: type
  analysis_crs: EPSG:3735       # NAD83 / Ohio South (ftUS) — ADR-0007
  units: ft
study:
  buffer_miles: 1.0             # SCOPE §2.2
  h3_resolution: 9              # SCOPE §2.2 [DECISION] — ADR-0009
site:
  min_parcel_sqft: 15000
  max_parcel_sqft: 200000
  target_stalls_range: [50, 300]
  stall_area_sqft_gross: 320
  layout_efficiency: 0.90
  setback_landscape_pct: 0.08   # check Columbus parking-lot landscaping/screening rules (CC 3312)
  max_slope_pct: 5
  min_frontage_ft: 60
  min_shape_index: 0.60         # metric = rectangularity (ADR-0025)
  improvement_ratio_max: 0.25
  frontage_buffer_ft: 50        # ADR-0080: ≈ p90 centerline→parcel-edge distance on drive streets (n 3,675)
demand:
  walk_shed_minutes: [3, 5, 8]
  decay_weights: {3: 1.0, 5: 0.6, 8: 0.25}
  dayparts: [wd_day, wd_eve, we_day, we_eve, event]
  parking_generation_source: "ITE Parking Generation / ULI Shared Parking"   # [VERIFY license] V-01
  transit_adjustment:
    high_frequency_radius_m: 400
    demand_factor: 0.85
    high_frequency_headway_max_min: 15     # SET (Bernard, M4 2026-09-26): COTA frequent-network definition
    peak_window: ["07:00", "09:00"]        # SET (Bernard, M4 2026-09-26): weekday AM peak
  mode_adjustment: relative     # SET (Bernard): commute categories only, workplace-based drive share (ADR-0068)
  commute_categories: [Office]  # ADR-0068: job-based demand; all other categories get the transit factor instead
  workplace_drive_share_path: franklin_oh/workplace_drive_share_tract.csv   # CTPP 2017-2021 B202105 tract of work, WFH excluded (ADR-0073)
  workplace_places_path: "C:/GIS/ParkIQ_cache/franklin_oh/demand/tl_2021_39_tract.zip"   # CTPP 2021 uses 2020-vintage tracts
  workplace_min_commuters: 100  # ADR-0073: tracts with fewer commuters fall back to the county share (factor 1)
  workplace_source_id: S25
  jurisdiction_places_path: "C:/GIS/ParkIQ_cache/franklin_oh/demand/tl_2024_39_place.zip"   # names of places hot zones touch
  meters_per_floor: 3.5         # ADR-0069: median height/levels, 5,351 Overture buildings (IQR 2.77-4.29)
  hotel_sqft_per_room: 713      # ADR-0069: median gross sq ft per room, 10 OSM hotels with rooms (building GFA shared among POIs)
  campus_rule: {Medical: [CNS16], University: [CNS15]}   # ADR-0070: jobs removed on the anchor's campus parcels
  single_anchor_share: 0.5      # SET (Bernard): hot zone flagged when one anchor supplies > 50% of its gap
  attendance_factor: {Office: {wd_day: 0.71}}   # ADR-0078 [VERIFY]: Placer.ai Nationwide Office Index, Jan–Jul 2026 mean visits vs same month 2019 (−29.0 %); no Columbus-specific figure vs 2019 published
  floor_area_cap_sqft: {RestaurantBar: 12220, Retail: 40758}   # ADR-0072: 90th pct of standalone-building footprints (1,449 / 1,795 places)
  residential_offstreet_share: null        # not used: residential excluded for the pilot (ADR-0015)
  excluded_anchor_categories: [ResidentialBlock]   # ADR-0015: no residential demand generation; rates stay in config
network:
  backend: osmnx                # ADR-0004 confirmed 2026-09-24
  walking_speed_m_s: 1.3
  network_type: walk
  graph_path: null              # null → download via OSMnx and cache
supply:
  private_effective_share: 0.50
  onstreet_stall_length_ft: 22  # Columbus meter layer (S20) may make this unnecessary downtown
  dedupe_distance_m: 40
  dedupe_name_similarity: 0.80  # ADR-0020 (Bernard, M3 2026-09-26): named pairs within 40 m merge at >= 0.80
  dedupe_unnamed_touch_m: 5     # ADR-0020 (Bernard): an unnamed record merges only with a same-type neighbour within 5 m
  unknown_access_as_private: true   # analyst choice (Bernard, M3 review 2026-09-26)
  curb_local_highways: [residential, living_street, unclassified]   # ADR-0021 (Bernard): "residential/local streets"
  curb_sensitive_ratio: 1.0     # analyst choice (Bernard, M3 review 2026-09-26)
  surface_capacity_factor: 1.414  # ADR-0067: median stated/area-estimate, 356 OSM surface lots (IQR 0.979-2.000), run 20260925_2217; existing lots only
  exclusions_path: franklin_oh/supply_exclusions.csv   # ADR-0067 (V-40): non-parking lots, reviewable list
  parcel_estimate_classes: [Commercial, MixedUse, SurfaceParking]   # ADR-0074: fill OSM gaps on these parcels
  parcel_estimate_max_acres: 5  # ADR-0074: calibration and application limited to parcels <= 5 acres
  paid_operators: [CampusParc, "LAZ", 'SP\+', Lazarus, "Park Columbus", "Towne Park", "ABM", "Parking Company of America", "Premier Parking", "Impark", "Reef"]   # ADR-0075: paid-market indicators (regex, reviewable)
  survey_observations_path: franklin_oh/survey/round1_observations.csv   # ADR-0075: rows with a posted price mark paid market (file added after fieldwork)
  paid_signal_overrides_path: franklin_oh/paid_signal_overrides.csv   # ADR-0075: reviewed fee/operator signals to drop (osm_id, action=drop)
  practical_capacity: 0.85      # ADR-0079: practical-capacity convention (market-evidence note only)
  benchmark_occupancy_path: franklin_oh/benchmark_occupancy.csv       # ADR-0079: SPP 2019 peak occupancy by area
c04_daypart_weights: {wd_day: 0.3571, wd_eve: 0.3572, we_day: 0.1428, we_eve: 0.1429, event: 0.0}   # ADR-0081: share of operating days (5/14, 5/14, 1/7, 1/7); events are C03

finance: {}                     # all SCOPE defaults from configs/finance_defaults.yaml; DECIDE keys null
ranking: {financial_weight: 0.70, suitability_weight: 0.30, shortlist_size: 10}   # SCOPE range 5–10
data_licenses:
  regrid: false                 # county auditor fallback (S01)
  foot_traffic: none
  parking_transactions: none

sources:
  S00:
    vintage: "2025"             # TIGER/Line year [VERIFY V-33]
  S01:
    enabled: true               # field map / crosswalk / owner rules approved at F3 (2026-09-25)
    url: "https://apps.franklincountyauditor.com/GIS_Shapefiles/CurrentExtracts/20260923_Parcel_Polygons.zip"
    vintage: "2026-09-23"       # Auditor extract date; appraisal tab-delimited file 2026-09-15; downloaded 2026-09-24
    path: "C:/GIS/ParkIQ_cache/franklin_oh/S01/2026-09-23/20260923_Parcel_Polygons/TAXPARCEL_CONDOUNITSTACK_LGIM.shp"
    field_map:
      parcel_id: PARCELID
      address: SITEADDRES
      owner: OWNERNME1
      land_use_code: CLASSCD            # Ohio DTE class code (= appraisal LUC 99.99%)
      assessed_land_value: LNDVALUEBA   # 100% appraised value (= appraisal COSTLAND 94.7%), not 35% taxable
      assessed_improvement_value: BLDVALUEBA
      year_built: RESYRBLT
    options:
      drop_if_null: [CLASSCD]           # 1,816 rows: out-of-county pieces and unclassed
      jurisdiction_join:
        path: "C:/GIS/ParkIQ_cache/franklin_oh/S01/2026-09-23/20260923_TaxDistricts/LOCALTAXDISTRICT.shp"
        key: CVTTXCD
        name_field: City
        fallback_field: Township
        rename: {"COLUMBUS CITY": Columbus}
      land_use_crosswalk_path: franklin_oh/s01_landuse_crosswalk.csv
      owner_overrides_path: franklin_oh/owner_overrides.csv
      owner_rules:                # ordered, case-insensitive, first match wins (reviewed F3, 2026-09-25)
        - {owner_type: Public, pattern: '\b(OHIO STATE UNIV|COLUMBUS STATE COMMUNITY|COLUMBUS TECHNICAL INSTITUTE)'}   # public universities
        - {owner_type: Public, pattern: '\b(CITY OF|VILLAGE OF|TOWNSHIP|TWP|COUNTY|STATE OF OHIO|STATE OF OH|UNITED STATES|USA)\b'}   # governments
        - {owner_type: Public, pattern: '\b(AUTHORITY|BOARD OF|BD OF|COMMISSIONERS|SCHOOL DISTRICT|CITY SCHOOL|LAND BANK|LAND REUTILIZATION|COMMUNITY IMPROVEMENT CORP|DISTRICT|METRO PARKS|METROPOLITAN PARK|DEPARTMENT OF|DEPT OF)'}   # public bodies
        - {owner_type: Corporate, pattern: '\b(LLC|L L C|INC|CORP|CORPORATION|CO|COMPANY|LTD|LP|L P|LLP|LC|PLLC|LIMITED)\b\.?'}   # entity suffix
        - {owner_type: Institutional, pattern: '\b(UNIVERSITY|COLLEGE|ACADEMY|SCHOOL|HOSPITAL|HEALTH|CHURCH|MINISTR\w*|CHRISTIAN|CONGREGATION|DIOCESE|BISHOP|TEMPLE|MOSQUE|MASJID|SYNAGOGUE|TABERNACLE|FELLOWSHIP|BAPTIST|METHODIST|LUTHERAN|CATHOLIC|PRESBYTERIAN|APOSTOLIC|GOSPEL|FOUNDATION|ASSOCIATION|ASSN|SOCIETY|CEMETERY|YMCA|YWCA|LODGE|CATHEDRAL|ORTHODOX|SISTERS|CONFERENCE|ASAMBLEAS|AERIE|CENTER FOR)\b'}   # non-profit / religious / care
        - {owner_type: Corporate, pattern: '\b(HOLDINGS?|PROPERT(Y|IES)|INVESTMENTS?|REALTY|BANK|ENTERPRISES?|GROUP|DEVELOPMENT|ACQUISITIONS?|PARTNERS(HIP)?|FUND|APARTMENTS|RAILROAD|RAILWAY|POWER|ELECTRIC|LABORATORIES|VENTURES?|CAPITAL|OWNER)\b'}   # business words
        - {owner_type: Private, pattern: '^\s*[A-Z''\-]+ [A-Z''\-]+( [A-Z''\-]+){0,3}( (TR|TRS|TTEE|TRUSTEE|JR|SR|II|III|IV))?\s*$'}   # individual (SURNAME GIVEN ...), incl. personal trusts
        - {owner_type: Private, pattern: '\b(TR|TRS|TTEE|TRUSTEE|TRUST|REVOCABLE|LIVING|ESTATE OF|ETAL|ET AL)\b'}   # personal trust / estate
  S02:
    enabled: true               # footprints for the code-456 surface/garage check (F3); latest release 2026-09-25
    vintage: "2026-09-23.1"     # Overture release id (S3 listing 2026-09-25)
  S03a: {enabled: false, vintage: null}     # Overture release id [VERIFY V-13]
  S03b: {enabled: true}                     # OSM POIs via Overpass
  S04:
    enabled: true               # LODES8 latest Ohio year = 2023 (listing checked 2026-09-25; files dated 2025-12-03)
    vintage: "2023"
    options: {url_params: {state_abbr: oh}}
  S05:
    enabled: true               # ACS 5-year 2020-2024 (2025 not published, checked 2026-09-25); key from CENSUS_API_KEY
    vintage: "2024"
  S06: {enabled: true}                      # OSM parking via Overpass
  S09:
    enabled: true               # COTA official feed (Mobility Database mdb 404); terms: cota.com/data "Terms of Agreement"
    url: "https://www.cota.com/data/cota.gtfs.zip"
    vintage: "2026-09-07"       # feed_version 2026-SEP-07-BB_20260904, valid 2026-09-07..2027-01-03
    options: {service_date: "20261014"}   # a plain Wednesday: no event supplements or holiday swaps
  S10:
    enabled: false              # DRAFT venues.csv (2026-09-26), every value [VERIFY] — enable after Bernard's check
    path: franklin_oh/venues.csv
    options: {x: lon, y: lat, xy_crs: "EPSG:4326"}
  S12a:
    enabled: true               # ONE bed source: CMS POS Q2 2026, BED_CNT (Bernard, M3 2026-09-26; ADR-0066)
    provider: "CMS Provider of Services (Hospital & other), geocoded"
    license: "Public domain (CMS)"
    url: null
    path: franklin_oh/hospitals_cms.csv
    vintage: "2026-Q2"
    field_map: {hospital_id: ccn, name: name, beds: beds}
    options: {x: lon, y: lat, xy_crs: "EPSG:4269"}   # Census geocoder returns NAD83
  S12b:
    enabled: true               # IPEDS HD2024/EFFY2024 latest (2025 -> 404, checked 2026-09-26)
    vintage: "2024"
    field_map: {unitid: UNITID, name: INSTNM}
    options:
      x: LONGITUD
      y: LATITUDE
      xy_crs: "EPSG:4326"
      enrollment_field: EFYTOTLT
      enrollment_filter: {EFFYLEV: "1"}   # all students, one row per UNITID
  S13:
    enabled: true               # ODOT TIMS stations layer 0; Franklin AADT_YEAR 2025 (checked 2026-09-26)
    provider: "ODOT Office of Technical Services (TIMS)"
    license: "Public web service [VERIFY terms]"
    url: "https://tims.dot.state.oh.us/ags/rest/services/Roadway_Information/Traffic_Count_Stations/MapServer/0"
    vintage: "2025"
    field_map: {count_id: STATION_ID_NBR, aadt: AADT, year: AADT_YEAR, road: NLFID}
    options: {where: "AADT IS NOT NULL"}
  S14:
    enabled: true               # NFHL layer 28; 9,137 polygons in the county envelope (2026-09-25)
    vintage: "2026-09"
    options:
      where: "ZONE_SUBTY IS NULL OR ZONE_SUBTY <> 'AREA OF MINIMAL FLOOD HAZARD'"  # 539 minimal-hazard X polygons carry no screen meaning
      page_size: 100              # full-detail polygons are ~75 KB each
      max_allowable_offset: 0.00001   # ~1 m server-side generalization, keeps pages transferable
      geometry_precision: 6
  S15:
    enabled: true               # EPA FRS_INTERESTS layer 0 = ACRES brownfields (41 in the envelope, 2026-09-25)
    url: "https://geodata.epa.gov/arcgis/rest/services/OEI/FRS_INTERESTS/MapServer/0"
    vintage: "2026-09"
    field_map: {site_id: REGISTRY_ID, name: PRIMARY_NAME, program: PGM_SYS_ACRNM}
    options: {brownfield_programs: [ACRES]}
  S20:
    enabled: true               # Columbus curb inventory (PublicService/MapServer/38), edited through 2026-09-25 (ADR-0064)
    provider: City of Columbus
    license: "Open data [VERIFY licence: sibling City items are CC0; this layer has no Hub item]"
    url: "https://maps2.columbus.gov/arcgis/rest/services/Schemas/PublicService/MapServer/38"
    vintage: "2026-09"
    field_map: {segment_id: AssetID, res_type: ResType, length_ft: Length, stalls_est: Spaces, rate_hour: Fee1}
    options: {where: "ResType = 'Metered Parking' AND Status = 'Active'"}
  S23:
    enabled: true               # Columbus Base Zoning Districts (18,871 polygons, 78 codes; checked 2026-09-24)
    url: "https://maps2.columbus.gov/arcgis/rest/services/Schemas/BuildingZoning/MapServer/4"
    vintage: "2026-09"
    field_map: {zoning_code: CLASSIFICATION, general_category: GENERAL_ZONING_CATEGORY, zoning_status: ZONING_STATUS, ord_no: ORD_NO, case_number: CASE_NUMBER}
    options:
      jurisdiction: Columbus
      zoning_table_path: franklin_oh/zoning_screen.csv
      code_aliases: {RURAL: R}
  S23b:
    enabled: true               # Columbus commercial (29) + planning (10) overlays
    url: "https://maps2.columbus.gov/arcgis/rest/services/Schemas/Development/MapServer/15"
    vintage: "2026-09"
    options:
      jurisdiction: Columbus
      planning_overlays_url: "https://maps2.columbus.gov/arcgis/rest/services/Schemas/Development/MapServer/20"
      type_codes:
        URBAN COMMERCIAL OVERLAY: "overlay:UCO"
        COMMUNITY COMMERCIAL OVERLAY: "overlay:CCO"
        REGIONAL COMMERCIAL OVERLAY: "overlay:RCO"
  S23c:
    enabled: true               # DERIVED from City Code Map 2 (ADR-0061) [VERIFY]; replaced if the City publishes GIS
    path: "C:/GIS/ParkIQ_cache/franklin_oh/S23c/S23c_parking_zones.gpkg"
    vintage: "Ord. 1532-2013 (Map 2 image dated 2026-07-01)"
    options:
      layer: ParkingZones
      jurisdiction: Columbus
      boundary_review_ft: 150     # SET by Bernard at F3 (2026-09-25): parcels this close to the A/B line -> Review
  S18:
    enabled: true               # approved 2026-09-24: one ImageServer export of the study area, cached
    url: "https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer"
    vintage: "2026-08"          # service copyright "3DEP. August 25, 2026"
    options:
      mode: imageserver
      imageserver_url: "https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer"
      cell_size_m: 10

provenance:
  study.buffer_miles:              {status: SCOPE,  source: "SCOPE §2.2"}
  study.h3_resolution:             {status: SCOPE,  source: "SCOPE §2.2 [DECISION] ADR-0009"}
  site.min_parcel_sqft:            {status: SCOPE,  source: "SCOPE §2.1 (yields ~39 stalls <50; ADR-0031)"}
  site.max_parcel_sqft:            {status: SCOPE,  source: "SCOPE §2.1"}
  site.stall_area_sqft_gross:      {status: SCOPE,  source: "SCOPE §2.1 [PARAMETER] 300–350 typical"}
  site.layout_efficiency:          {status: SCOPE,  source: "SCOPE §2.1"}
