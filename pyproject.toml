[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parkiq"
version = "0.1.0"
description = "Config-driven site selection and underwriting for paid surface parking lots"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Bernard Issifu" }]
# Runtime deps are installed by environment.yml (conda-forge); listed here for pip installs.
dependencies = [
  "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "pyogrio>=0.9", "rasterio>=1.3",
  "osmnx>=2.0", "pandana>=0.7", "networkx>=3.2", "h3>=4.1",
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=15", "duckdb>=1.0", "scipy>=1.11", "rapidfuzz>=3.0",
  "typer>=0.12", "pydantic>=2.6", "pyyaml>=6.0", "requests>=2.31",
  "openpyxl>=3.1", "xlsxwriter>=3.1", "matplotlib>=3.8", "plotly>=5.18",
  "python-docx>=1.1", "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "formulas>=1.2",
       "types-pyyaml", "types-requests"]

[project.scripts]
parkiq = "parkiq.cli:app"

[tool.setuptools.packages.find]
include = ["parkiq*"]

[tool.setuptools.package-data]
parkiq = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["arcgis/manual"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "N818"]  # allow ×, ÷, – in text; StepBlocked-style names

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["parkiq"]

[[tool.mypy.overrides]]
module = ["pandas.*", "geopandas.*", "shapely.*", "pyproj.*", "pyogrio.*", "rasterio.*", "osmnx.*",
          "pandana.*", "networkx.*", "h3.*", "duckdb.*", "scipy.*", "rapidfuzz.*",
          "formulas.*", "xlsxwriter.*", "openpyxl.*", "docx.*", "plotly.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not arcpy' --strict-markers"
markers = [
  "unit: fast unit tests (default)",
  "integration: fixture-market pipeline runs",
  "network: live endpoint smoke tests (opt-in: pytest -m network)",
  "arcpy: requires ArcGIS Pro / ArcPy",
]
filterwarnings = ["ignore::DeprecationWarning:osmnx.*"]
