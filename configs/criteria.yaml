# Scoring criteria C01–C10 — SCOPE §5.7, with measurement details from ADR-0028 / manual §11.1.
# direction: Benefit (higher is better) | Cost (lower is better; inverted after normalization).
# normalization (SCOPE §5.7): winsorize at the given percentiles, min–max to [0, 100].
# A criterion with no data or zero variance scores `constant_score` for every site and is logged —
# weights are never silently renormalized (docs/ENGINEERING.md, ADR-0028).

normalization:
  winsor_percentiles: [0.05, 0.95]
  scale: [0, 100]
  constant_score: 50

criteria:
  C01: {name: "Unmet demand, weekday day",     unit: stalls,   direction: Benefit, shed_minutes: 5, dayparts: [wd_day],                 description: "Net Σ gap_stalls over hexes in the 5-min shed, floored at 0"}
  C02: {name: "Unmet demand, evening/weekend", unit: stalls,   direction: Benefit, shed_minutes: 5, dayparts: [wd_eve, we_day, we_eve], description: "Net Σ gap_stalls (wd_eve + we_day + we_eve) in the 5-min shed, floored at 0"}
  C03: {name: "Event demand",                  unit: stall_events, direction: Benefit, shed_minutes: 8, dayparts: [event],          description: "Event gap stalls in 8-min shed × events per year of venues within 8 min"}
  C04: {name: "Achievable rate",               unit: index,    direction: Benefit, description: "Weighted mean of daypart rate indices at the parcel"}
  C05: {name: "Competing supply",              unit: stalls,   direction: Cost,    shed_minutes: 3, description: "Effective supply stalls within 3 min, excluding the parcel's own facility"}
  C06: {name: "Anchor proximity",              unit: minutes,  direction: Cost,    description: "Mean walk minutes to the top-3 anchors by demand"}
  C07: {name: "Land cost",                     unit: usd_per_stall, direction: Cost, description: "Land cost (buy basis) ÷ buildable stalls"}
  C08: {name: "Access quality",                unit: score,    direction: Benefit, description: "Mean of corner (0/100), arterial frontage (0/100), AADT percentile, curb-cut score (null excluded)"}
  C09: {name: "Zoning certainty",              unit: score,    direction: Benefit, description: "ByRight = 100, Conditional = 60, Unknown = 40"}
  C10: {name: "Pipeline risk",                 unit: count,    direction: Cost,    shed_minutes: 5, description: "Planned garages/developments within 5 min"}

# C04 daypart weights — method choice, DECIDE (manual §11.1). null → the criteria step refuses to run.
c04_daypart_weights: null   # set per market (markets/<slug>.yaml c04_daypart_weights)
# C06 search (ADR-0028): top-N anchors within a search radius; missing anchors take the cap value.
c06: {top_n: 3, search_minutes: 15, missing_minutes: 15}
# C09 scores — SCOPE §5.7 verbatim. Prohibited parcels never reach scoring (screened out).
c09_scores: {ByRight: 100, Conditional: 60, Unknown: 40}

provenance:
  normalization:       {status: SCOPE, source: "SCOPE §5.7"}
  c09_scores:          {status: SCOPE, source: "SCOPE §5.7"}
  c06:                 {status: SCOPE, source: "ADR-0028 (15-min search, cap 15) — proposed"}
