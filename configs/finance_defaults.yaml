# Finance defaults (SCOPE §2.1 `finance:` + §5.8). A market's `finance:` block overrides any key.
# Status vocabulary (same as the admin workbook Parameters sheet):
#   SCOPE  = copied from SCOPE.md, still a placeholder
#   VERIFY = must be confirmed against a source before partner use (docs/VERIFY.md)
#   SET    = confirmed, with citation
#   DECIDE = no value; null here. The step that needs it refuses to run until the market sets it.
# Keys marked DECIDE come from ADR-0032..0039 / manual §12 — SCOPE names the concept but gives no value.

finance:
  land_cost_source: [regrid_assessed, listings]   # order of preference; county assessed values stand in for regrid_assessed
  assessed_to_market_ratio: 1.20        # ratio   — calibrate per market from ≥5 land listings (manual §12.3)
  construction_cost_per_stall_usd: 6500 # USD     — regional quote / RSMeans (V-02)
  soft_cost_pct: 0.15                   # fraction of hard (construction) cost — base per ADR-0040
  opex_per_stall_year_usd: 450          # USD/stall/yr — maintenance, insurance, enforcement
  property_tax_rate: 0.012              # fraction of taxable base per year
  new_entrant_rate_discount: 0.10       # fraction off the rate surface
  occupancy_caps: {wd_day: 0.85, wd_eve: 0.60, we_day: 0.40, we_eve: 0.70, event: 0.90}
  target_cap_rate: 0.075
  hold_years: 10
  discount_rate: 0.12

  # ---- DECIDE (null until the analyst sets them per market) ----
  tech_fee_pct_revenue: null            # payment/LPR fees, fraction of gross revenue (ADR-0035)
  mgmt_fee_pct_revenue: null            # operator management fee, fraction of gross revenue (ADR-0035)
  occupancy_curve: null                 # list of [gap_ratio, occupancy] breakpoints, ascending x (ADR-0032)
  capture_share: null                   # fraction of unmet stalls a new lot can capture (ADR-0032)
  billing: null                         # per daypart {basis: daily|hourly|flat, units: hours or turns} (ADR-0033)
  operating_days: null                  # per daypart, days/yr (ADR-0033)
  event_weekday_share: null             # fraction of event days falling on weekdays (ADR-0033)
  permit_share: null                    # fraction of stalls sold as monthly permits in office-heavy sites (ADR-0034)
  office_heavy_threshold: null          # office share of wd_day demand in 5-min shed (ADR-0034)
  revenue_growth: null                  # per year
  opex_growth: null                     # per year
  exit_cap_rate: null                   # null → must be set (may equal target_cap_rate; state it) (ADR-0037)
  selling_cost_pct: null                # fraction of exit value (ADR-0037)
  ground_lease_rent_pct_of_land_value: null   # per year (ADR-0039)
  ground_lease_escalator: null                # per year (ADR-0039)
  ground_lease_term_years: null               # years (ADR-0037)
  # Listing-rate → daypart mapping (ADR-0023). Method choice, not a number.
  daypart_rate_map:
    wd_day: [rate_early_bird, rate_day]
    wd_eve: [rate_evening, hourly_x_evening_stay]
    we_day: [rate_weekend, rate_day]
    we_eve: [rate_evening, hourly_x_evening_stay]
    event:  [rate_event, max_posted]
  evening_stay_hours: null              # hours; used by hourly_x_evening_stay (DECIDE)

provenance:
  finance.assessed_to_market_ratio:        {status: VERIFY, source: "SCOPE §2.1 [PARAMETER] calibrated per market"}
  finance.construction_cost_per_stall_usd: {status: VERIFY, source: "SCOPE §2.1 [PARAMETER][VERIFY regional]"}
  finance.soft_cost_pct:                   {status: SCOPE,  source: "SCOPE §2.1"}
  finance.opex_per_stall_year_usd:         {status: VERIFY, source: "SCOPE §2.1 [PARAMETER]"}
  finance.property_tax_rate:               {status: VERIFY, source: "SCOPE §2.1"}
  finance.new_entrant_rate_discount:       {status: SCOPE,  source: "SCOPE §2.1"}
  finance.occupancy_caps:                  {status: SCOPE,  source: "SCOPE §2.1"}
  finance.target_cap_rate:                 {status: VERIFY, source: "SCOPE §2.1"}
  finance.hold_years:                      {status: SCOPE,  source: "SCOPE §2.1"}
  finance.discount_rate:                   {status: SCOPE,  source: "SCOPE §2.1"}
