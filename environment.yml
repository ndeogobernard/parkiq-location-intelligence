# ParkIQ runtime + dev environment (SCOPE §6.1).
# Create:  conda env create -p C:\GIS\envs\parkiq -f environment.yml
# ArcGIS Pro's own conda works: "C:\Program Files\ArcGIS\Pro\bin\Python\Scripts\conda.exe".
# This is a separate env; arcgispro-py3 is not modified.
name: parkiq
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  # geo core
  - geopandas>=1.0
  - shapely>=2.0
  - pyproj>=3.6
  - pyogrio>=0.9
  - rasterio>=1.3
  - osmnx>=2.0
  - pandana>=0.7
  - networkx>=3.2
  - h3-py>=4.1
  # data
  - numpy>=1.26
  - pandas>=2.1
  - pyarrow>=15
  - python-duckdb>=1.0
  - scipy>=1.11
  - rapidfuzz>=3.0
  # app
  - typer>=0.12
  - pydantic>=2.6
  - pyyaml>=6.0
  - requests>=2.31
  - truststore>=0.9      # verify HTTPS against the OS cert store (networks with TLS inspection)
  # outputs
  - openpyxl>=3.1
  - xlsxwriter>=3.1
  - matplotlib>=3.8
  - plotly>=5.18
  - python-docx>=1.1
  - jinja2>=3.1
  - markdown>=3.5        # portfolio reports: Markdown → HTML → PDF (headless Edge/Chrome)
  # dev
  - pytest>=8.0
  - pytest-cov>=5.0
  - ruff>=0.5
  - mypy>=1.10
  - types-pyyaml
  - types-requests
  - pip
  - pip:
      - formulas>=1.2   # independent Excel recalculation for the finance parity test (ADR-0042, V-32)
